[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "libRSI"
version = "0.2.0"
description = "Host-agnostic policies and ports for bounded recursive self-improvement"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
authors = [{ name = "Ethan Stillman" }]
keywords = [
  "recursive-self-improvement",
  "hypothesis-testing",
  "experimentation",
  "policy",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/estill01/libRSI"
Repository = "https://github.com/estill01/libRSI.git"
Issues = "https://github.com/estill01/libRSI/issues"

[project.scripts]
librsi = "librsi.cli.main:entrypoint"
librsi-http = "librsi.http.__main__:entrypoint"
librsi-mcp = "librsi.mcp.__main__:entrypoint"

[project.optional-dependencies]
openai = [
  "openai>=3,<4",
]
codex = [
  "codex-app-server-client @ git+https://github.com/estill01/utils.git@a5659745a7cbcbb002b5f06051f6ed9826f721a7#subdirectory=packages/codex-app-server-client",
]
providers = [
  "openai>=3,<4",
  "codex-app-server-client @ git+https://github.com/estill01/utils.git@a5659745a7cbcbb002b5f06051f6ed9826f721a7#subdirectory=packages/codex-app-server-client",
]
server = [
  "fastapi>=0.141,<1",
  "uvicorn>=0.52,<1",
]
mcp = [
  "mcp>=2,<3",
]
service = [
  "fastapi>=0.141,<1",
  "mcp>=2,<3",
  "uvicorn>=0.52,<1",
]
dev = [
  "build>=1.2",
  "codex-app-server-client @ git+https://github.com/estill01/utils.git@a5659745a7cbcbb002b5f06051f6ed9826f721a7#subdirectory=packages/codex-app-server-client",
  "fastapi>=0.141,<1",
  "httpx>=0.28,<1",
  "jsonschema>=4.23",
  "mcp>=2,<3",
  "mypy>=1.11",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "uvicorn>=0.52,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["librsi*"]

[tool.setuptools.package-data]
librsi = ["README.md", "py.typed", "conformance/*.json", "providers/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.coverage.run]
branch = true
source = ["librsi"]

[tool.coverage.report]
fail_under = 90
show_missing = true
