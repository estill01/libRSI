  <g id="text_33">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start" x="74.52" y="364.032" transform="rotate(-0 74.52 364.032)">32 native optimizations per arm; meta adds 73 development calls. Timeout retries: ordinary 1, meta 1.</text>
  </g>
  <g id="text_34">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(74.52 379.677266)">Full study: 171 calls, 381.1 recorded phase minutes.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(74.52 391.68)">Additional forced-revision diagnostic: 32 calls (excluded from the two primary treatment budgets).</text>
  </g>
  <g id="text_35">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #4c5564" transform="translate(74.52 409.243078)">No model calls during scheduler execution; both optimized schedulers get 256 cost evaluations per workload.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #4c5564" transform="translate(74.52 420.045539)">Includes reused generation time, interruptions and recovery pauses. Cached input included; timeout usage and billing unknown.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #4c5564" transform="translate(74.52 430.848)">This comparison does not establish superiority at equal total compute.</text>
  </g>
