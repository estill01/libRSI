name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - python-version: "3.11"
            coverage: true
          - python-version: "3.12"
            coverage: false
          - python-version: "3.13"
            coverage: false

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'

      - name: Install exact accepted shared utility artifacts
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/estill01/utils.git "$RUNNER_TEMP/librsi-utils"
          git -C "$RUNNER_TEMP/librsi-utils" fetch --depth=1 origin a5659745a7cbcbb002b5f06051f6ed9826f721a7
          git -C "$RUNNER_TEMP/librsi-utils" checkout --detach a5659745a7cbcbb002b5f06051f6ed9826f721a7
          test "$(git -C "$RUNNER_TEMP/librsi-utils" rev-parse HEAD)" = "a5659745a7cbcbb002b5f06051f6ed9826f721a7"
          mkdir -p "$RUNNER_TEMP/librsi-utils-dist"
          python -m build --wheel --outdir "$RUNNER_TEMP/librsi-utils-dist" "$RUNNER_TEMP/librsi-utils/packages/codex-app-server-client"
          python -m build --wheel --outdir "$RUNNER_TEMP/librsi-utils-dist" "$RUNNER_TEMP/librsi-utils/packages/embedded-service-contract"
          python -m build --wheel --outdir "$RUNNER_TEMP/librsi-utils-dist" "$RUNNER_TEMP/librsi-utils/packages/runtime-manifest"
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "librsi-utils-dist"
          expected = {
              "codex_app_server_client-0.1.0-py3-none-any.whl": "1e9dc5b9c7f2edb9676b5a47eb2c9b96498f1b429acec474cd26702fe8e3fdb9",
              "embedded_service_contract-0.1.0-py3-none-any.whl": "2b36d7307c08cd6d7d95bfb86d4a240b6ab2a69de5b2c61bf75a54507c7ea18d",
              "runtime_manifest-0.1.0-py3-none-any.whl": "f2e601d542272187998296f09d33b2235002d108fe07c0b3c89a678ea1d010ac",
          }
          observed = {path.name: hashlib.sha256(path.read_bytes()).hexdigest() for path in root.glob("*.whl")}
          if observed != expected:
              raise SystemExit(f"shared utility artifacts differ: {observed}")
          PY
          python -m pip install --no-deps "$RUNNER_TEMP/librsi-utils-dist"/*.whl

      - name: Lint
        run: python -m ruff check src tests examples

      - name: Check formatting
        run: python -m ruff format --check src tests examples

      - name: Type-check
        run: python -m mypy src examples

      # PRs use the fast lane on every supported Python. Main gets the full
      # coverage gate once; scheduled/manual runs also exercise the full suite
      # on the other versions. Bare pytest still runs everything locally.
      - name: Fast regression tests
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && !matrix.coverage)
        run: python -m pytest -m "not slow" --durations=15

      - name: Full regression tests with branch coverage
        if: github.event_name != 'pull_request' && matrix.coverage
        run: python -m pytest --cov=librsi --cov-branch --cov-report=term-missing --durations=25

      - name: Full Python compatibility tests
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && !matrix.coverage
        run: python -m pytest --durations=25

      - name: Build distributions
        if: matrix.python-version == '3.11'
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          python -m build

      - name: Audit release artifacts
        if: matrix.python-version == '3.11'
        run: python -m tests.block26_release_audit dist --license MIT

      - name: Smoke-test installed wheel and examples
        if: matrix.python-version == '3.11'
        run: |
          python -m venv "$RUNNER_TEMP/librsi-release-venv"
          "$RUNNER_TEMP/librsi-release-venv/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/librsi-release-venv/bin/python" -m pip check
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/librsi-release-venv/bin/python" -I "$GITHUB_WORKSPACE/examples/local_validation.py"
          "$RUNNER_TEMP/librsi-release-venv/bin/python" -I "$GITHUB_WORKSPACE/examples/local_hypothesis.py"
          "$RUNNER_TEMP/librsi-release-venv/bin/librsi" --help
          "$RUNNER_TEMP/librsi-release-venv/bin/librsi-http" --help
          "$RUNNER_TEMP/librsi-release-venv/bin/librsi-mcp" --help
